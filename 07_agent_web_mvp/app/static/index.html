<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YU AI Agent Web MVP</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <span class="badge">GPU PBL · Final MVP</span>
      <h1>YU AI Agent</h1>
      <p>Qwen3-8B + Custom Tool + FastAPI</p>
    </section>

    <section class="panel">
      <label for="query">질문</label>
      <textarea id="query" rows="4"
        placeholder="예: 33명이 30시간씩 GPU를 사용하면 총 몇 GPU-hour야?"></textarea>
      <div class="actions">
        <button id="sendBtn">Agent 실행</button>
        <button id="healthBtn" class="secondary">GPU 상태</button>
      </div>
      <p id="status" class="status">준비됨</p>
    </section>

    <section class="panel">
      <h2>최종 응답</h2>
      <div id="answer" class="answer">아직 실행하지 않았습니다.</div>
    </section>

    <section class="panel">
      <h2>실행 정보</h2>
      <pre id="details">{}</pre>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
